<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#FAFAF8">
<meta name="robots" content="noindex">
<title>Planner</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF8;--line:#E4E3DE;--line2:#EFEEEA;--ink:#18181B;--mute:#5F5F5A;--faint:#8A8A84;--chip:#EDECE7;--sat:#2348B8;--sun:#B4231F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none;margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 48px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:4px}
.tab{flex:1;padding:10px 0;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:500;color:var(--mute)}
.tab.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;gap:8px}
.arrow{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0;color:var(--ink)}
.arrow:disabled{color:#C9C8C2}
.navmid{flex:1;display:flex;flex-direction:column;align-items:center}
.navsub{font-size:12px;color:var(--mute);font-weight:600}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.5px}
h2{margin:0;font-size:18px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;font-size:13px;background:#fff;color:#3F3F3B;border:1px solid var(--line);font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.stack{display:flex;flex-direction:column;gap:8px}
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline}
.sechead span{font-size:12px;color:var(--mute)}
.day{display:flex;gap:12px;padding:16px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.day.empty{padding:12px 16px}
.day.today{border:1.5px solid var(--ink)}
.dl{width:46px;flex-shrink:0;display:flex;flex-direction:column}
.dnum{font-size:22px;font-weight:700;line-height:1.1}
.dnum.sm{font-size:18px}
.dow{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--mute)}
.today .dow{color:var(--ink)}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding-top:3px}
.blk{display:flex;gap:10px}
.blab{width:28px;flex-shrink:0;font-size:12px;font-weight:600;color:var(--mute);padding-top:2px}
.btxt{flex:1;min-width:0;font-size:15px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.due{display:flex;align-items:center;gap:8px}
.duetag{flex-shrink:0;font-size:11px;font-weight:700;color:#fff;background:var(--sun);padding:2px 7px;border-radius:999px}
.duetag.past{background:var(--faint)}
.tent{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--faint);border-radius:10px}
.tentag{flex-shrink:0;font-size:11px;font-weight:700;color:#3F3F3B}
.muted{font-size:14px;color:var(--faint)}
.strike{color:var(--faint);text-decoration:line-through}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.card.dash{border-style:dashed;border-color:var(--faint)}
.row{display:flex;align-items:center;gap:10px;padding:13px 16px;min-height:48px}
.row+.row{border-top:1px solid var(--line2)}
.row.top{align-items:flex-start}
.rtext{flex:1;min-width:0;font-size:15px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.rtext.b{font-weight:500}
.rdue{font-size:13px;color:var(--mute);flex-shrink:0;font-variant-numeric:tabular-nums}
.st{flex-shrink:0;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
.st.todo{color:#3F3F3B;background:var(--chip)}
.st.doing{color:#fff;background:var(--sat)}
.st.done{color:#fff;background:var(--sun)}
.ghead{font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--mute)}
.ghead.urgent{color:var(--sun)}
.grp{display:flex;flex-direction:column;gap:6px}
.cal{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px 10px;display:flex;flex-direction:column;gap:4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wh{text-align:center;font-size:12px;font-weight:600;padding:4px 0 6px;color:var(--mute)}
.c5{color:var(--sat)}.c6{color:var(--sun)}
.cell{height:50px;border:1.5px solid transparent;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
.cell .n{font-size:15px;font-weight:500}
.cell.out .n{color:var(--faint);font-weight:400}
.cell.today{border-color:var(--ink)}
.cell.today .n{font-weight:700}
.cell.sel{background:var(--ink);border-color:var(--ink)}
.cell.sel .n{color:#fff;font-weight:700}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.dot.o{background:transparent;border:1.5px solid var(--ink)}
.dot.r{background:var(--sun)}
.sel .dot{background:#fff}.sel .dot.o{background:transparent;border-color:#fff}.sel .dot.r{background:#FF8A80}
.legend{display:flex;gap:14px;justify-content:center;padding-top:6px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.rtag{flex-shrink:0;min-width:28px;font-size:12px;font-weight:700;color:var(--mute);margin-top:2px}
.rtag.due{font-size:11px;color:#fff;background:var(--sun);padding:2px 7px;border-radius:999px;display:inline}
.rtag.tent{font-size:11px;color:#3F3F3B;border:1px dashed var(--faint);padding:1px 6px;border-radius:999px;display:inline}
/* quick add */
#scrim{position:fixed;inset:0;background:transparent;z-index:10;visibility:hidden;pointer-events:none;transition:background-color .2s}
#scrim.on{background:rgba(24,24,27,.35);visibility:visible;pointer-events:auto}
#qa{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);padding:max(14px,env(safe-area-inset-top)) 16px 18px;border-radius:0 0 20px 20px;box-shadow:0 12px 32px rgba(0,0,0,.18);transform:translateY(-110%);transition:transform .28s ease}
#qa.on{transform:translateY(0)}
#qa .inner{max-width:480px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:0 12px;height:44px}
#qi{flex:1;min-width:0;border:0;background:transparent;font-family:inherit;font-size:16px;color:var(--ink);outline:none;height:40px}
#qi::placeholder{color:var(--faint)}
#prev{margin-top:14px;display:flex;flex-direction:column;gap:12px}
#prev:empty{display:none}
.datebox{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;align-self:flex-start}
.datebox button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0}
.datebox span{font-size:14px;font-weight:600;min-width:76px;text-align:center}
.hint{font-size:12px;font-weight:600;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opt{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:12px;background:#fff;border:1px solid var(--line);padding:6px 0}
.opt b{font-size:15px}.opt small{font-size:11px;color:var(--mute)}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}.opt.on small{color:#E4E3DE}
.slots{display:flex;gap:6px}
.slot{flex:1;min-height:40px;border-radius:10px;font-size:13px;background:#fff;border:1px solid var(--line);font-weight:500;color:#3F3F3B}
.slot.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.ptitle{display:flex;align-items:center;gap:8px}
.ptitle b{flex:1;min-width:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.ptag{flex-shrink:0;font-size:11px;font-weight:700;color:#3F3F3B;border:1px dashed var(--faint);padding:2px 7px;border-radius:999px}
.save{height:48px;border-radius:12px;border:0;font-size:15px;font-weight:600;background:var(--ink);color:#fff}
.save:disabled{background:#D6D5CF;color:#3F3F3B}
#toast{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;max-width:448px;margin:0 auto;z-index:30;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#hap-l{position:fixed;top:0;left:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="scrim"></div>
<div id="qa" data-noswipe>
  <div class="inner">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F5F5A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="qi" class="sr">잠정 일정 입력</label>
      <input id="qi" type="text" placeholder="목 오후 박사님 미팅" autocomplete="off" autocorrect="off" enterkeyhint="done">
    </div>
    <div id="prev"></div>
  </div>
</div>
<main id="app"></main>
<div id="toast" role="status"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg><span id="toastt"></span></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyu904qUEAlw9F9QeZCrjHJJnn3LCwKaH51EC3q9YMn0YRixNOE5lvp9EwpK9c96wGY/exec';
var KEY = '';
try {
  var km = location.hash.match(/k=([^&]+)/);
  if (km) { KEY = decodeURIComponent(km[1]); localStorage.setItem('planner-key', KEY); }
  else KEY = localStorage.getItem('planner-key') || '';
} catch (e) {}
function apiGet() {
  return fetch(API + '?a=data&k=' + encodeURIComponent(KEY)).then(function (r) { return r.json(); })
    .then(function (d) { if (d.error) throw new Error(d.error); return d; });
}
function apiAdd(item) {
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: KEY, item: item }) })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.error) throw new Error(d.error); return d.tentative; });
}
var CACHE = 'planner-cache-v1';
var BLOCKS = ['오전', '오후', '저녁'];
var DOW_EN = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
var DOW_KR = ['일', '월', '화', '수', '목', '금', '토'];
var MON_S = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MON_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var REL = ['지난주', '이번 주', '다음 주', '2주 뒤', '3주 뒤', '4주 뒤'];
var IC_L = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';
var IC_R = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';

var data = null;
var S = { view: 'week', wk: 1, mo: 0, sel: null, open: false, q: '', shift: 0, blockOv: null, pick: null, syncing: true, error: '' };
var W = {};

/* ---------- 날짜 도우미 ---------- */
function pad(n) { return (n < 10 ? '0' : '') + n; }
function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fromKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function add(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

/* ---------- 데이터 정리 ---------- */
function derive() {
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var monday = add(today, -((today.getDay() + 6) % 7));
  var winStart = add(monday, -7), winEnd = add(winStart, 41);
  var days = {}, sheetOf = {}, sheets = (data && data.sheets) || [];
  sheets.forEach(function (s, i) {
    s.dates.forEach(function (k) { days[k] = s.days[k]; sheetOf[k] = i; });
  });
  var tk = key(today), cur = null;
  if (sheetOf[tk] != null) cur = sheets[sheetOf[tk]];
  else sheets.forEach(function (s) { if (s.dates[0] <= tk) cur = s; });
  if (!cur && sheets.length) cur = sheets[0];
  var dues = {};
  ((cur && cur.upcoming) || []).forEach(function (g) {
    g.items.forEach(function (it) { if (it.key) (dues[it.key] = dues[it.key] || []).push(it); });
  });
  var tentBy = {}, inbox = [];
  ((data && data.tentative) || []).forEach(function (t) {
    if (t.date) (tentBy[t.date] = tentBy[t.date] || []).push(t); else inbox.push(t);
  });
  var months = [];
  for (var d = new Date(winStart.getFullYear(), winStart.getMonth(), 1); d <= winEnd; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) months.push(d);
  W = { today: today, tk: tk, winStart: winStart, winEnd: winEnd, days: days, sheetOf: sheetOf, sheets: sheets, cur: cur, dues: dues, tentBy: tentBy, inbox: inbox, months: months };
  if (!S.sel) S.sel = tk;
  if (S.mo >= months.length) S.mo = months.length - 1;
}

/* ---------- 자연어 해석 ---------- */
function parse(q) {
  var s = (q || '').trim();
  if (!s) return null;
  var today = W.today;
  var rest = ' ' + s + ' ';
  var date = null, dowIdx = null, block = null, timeLabel = '', m;
  m = rest.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/) || rest.match(/(?:^|\s)(\d{1,2})\s*[\/.]\s*(\d{1,2})(?=\s|\D|$)/);
  if (m && +m[1] >= 1 && +m[1] <= 12 && +m[2] >= 1 && +m[2] <= 31) {
    date = new Date(today.getFullYear(), +m[1] - 1, +m[2]);
    if (date < add(today, -90)) date = new Date(today.getFullYear() + 1, +m[1] - 1, +m[2]);
    rest = rest.replace(m[0], ' ');
  }
  if (!date) {
    if (/오늘/.test(rest)) { date = today; rest = rest.replace('오늘', ' '); }
    else if (/내일/.test(rest)) { date = add(today, 1); rest = rest.replace('내일', ' '); }
    else if (/모레/.test(rest)) { date = add(today, 2); rest = rest.replace('모레', ' '); }
  }
  if (!date) {
    m = rest.match(/(?:^|\s)(\d{1,2})\s*일(?=\s|$)/);
    if (m && +m[1] >= 1 && +m[1] <= 31) {
      var n = +m[1], cands = [];
      for (var i = 0; i < 42; i++) { var c = add(W.winStart, i); if (c.getDate() === n) cands.push(c); }
      if (cands.length) {
        date = cands.filter(function (c) { return c >= today; })[0] || cands[cands.length - 1];
        rest = rest.replace(m[0], ' ');
      }
    }
  }
  if (!date) {
    m = rest.match(/(^|\s)(다음\s*주|담주|이번\s*주)?\s*([월화수목금토일])(요일)?(?=\s|\d|$)/);
    if (m) {
      var idx = '월화수목금토일'.indexOf(m[3]);
      var monday = add(today, -((today.getDay() + 6) % 7));
      if (m[2] && m[2].indexOf('이번') === -1) date = add(monday, 7 + idx);
      else if (m[2]) date = add(monday, idx);
      else dowIdx = idx;
      rest = rest.replace(m[0], ' ');
    }
  }
  m = rest.match(/(오전|오후)?\s*(\d{1,2})(?::(\d{2}))?\s*시(\s*반)?/) || rest.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
  if (m) {
    var h, min, mer;
    if (/시/.test(m[0])) { mer = m[1]; h = +m[2]; min = m[3] ? +m[3] : (m[4] ? 30 : 0); }
    else { h = +m[1]; min = m[2] ? +m[2] : 0; mer = m[3].toLowerCase() === 'pm' ? '오후' : '오전'; }
    if (mer === '오후' && h < 12) h += 12;
    if (!mer && h >= 1 && h <= 7) h += 12;
    if (h <= 24) {
      block = h < 12 ? '오전' : (h < 18 ? '오후' : '저녁');
      var h12 = h % 12 === 0 ? 12 : h % 12;
      timeLabel = h12 + (min ? ':' + pad(min) : '') + (h < 12 ? 'AM' : 'PM');
      rest = rest.replace(m[0], ' ');
    }
  }
  if (/오전|아침/.test(rest)) { block = '오전'; rest = rest.replace(/오전|아침/, ' '); }
  else if (/오후/.test(rest)) { block = '오후'; rest = rest.replace('오후', ' '); }
  else if (/밤/.test(rest)) { block = '저녁'; rest = rest.replace('밤', ' '); }
  else if (!block && /점심/.test(rest)) block = '오후';
  else if (!block && /저녁/.test(rest)) block = '저녁';
  var title = (timeLabel ? timeLabel + ' ' : '') + rest.replace(/\s+/g, ' ').trim();
  return { date: date, dowIdx: dowIdx, block: block, title: title };
}

/* ---------- 그리기 ---------- */
function render() {
  derive();
  var isWeek = S.view === 'week';
  var h = '<header class="head">';
  h += '<div class="tabs" role="group" aria-label="보기 전환"><button class="tab' + (isWeek ? ' on' : '') + '" data-a="view" data-v="week">주간</button><button class="tab' + (!isWeek ? ' on' : '') + '" data-a="view" data-v="month">한 달</button></div>';
  var title, sub, canP, canN, chips = '';
  if (isWeek) {
    var st = add(W.winStart, S.wk * 7), en = add(st, 6);
    title = MON_S[st.getMonth()] + ' ' + st.getDate() + ' ~ ' + (st.getMonth() === en.getMonth() ? en.getDate() : MON_S[en.getMonth()] + ' ' + en.getDate());
    sub = REL[S.wk];
    canP = S.wk > 0; canN = S.wk < 5;
    REL.forEach(function (r, i) { chips += '<button class="chip' + (i === S.wk ? ' on' : '') + '" data-a="wk" data-v="' + i + '">' + r + '</button>'; });
  } else {
    var md = W.months[S.mo];
    title = MON_L[md.getMonth()];
    sub = String(md.getFullYear());
    canP = S.mo > 0; canN = S.mo < W.months.length - 1;
    W.months.forEach(function (d, i) { chips += '<button class="chip' + (i === S.mo ? ' on' : '') + '" data-a="mo" data-v="' + i + '">' + (d.getMonth() + 1) + '월</button>'; });
  }
  var syncTxt = S.error === 'nokey' ? ' · 키 없음' : S.error === 'unauthorized' ? ' · 키 틀림' : S.error ? ' · 오프라인' : (S.syncing ? ' · 동기화 중' : (data ? ' · ' + data.synced : ''));
  h += '<div class="nav"><button class="arrow" data-a="step" data-v="-1" aria-label="이전"' + (canP ? '' : ' disabled') + '>' + IC_L + '</button>';
  h += '<div class="navmid"><span class="navsub">' + esc(sub + syncTxt) + '</span><h1>' + esc(title) + '</h1></div>';
  h += '<button class="arrow" data-a="step" data-v="1" aria-label="다음"' + (canN ? '' : ' disabled') + '>' + IC_R + '</button></div>';
  h += '<div class="chips" data-noswipe>' + chips + '</div></header>';

  if (W.inbox.length) {
    h += '<section class="sec" style="gap:8px"><div class="sechead"><h2 style="font-size:15px">수신함</h2><span>시트에 옮길 것</span></div><div class="card dash">';
    W.inbox.forEach(function (t) { h += '<div class="row"><span class="rtext">' + esc(t.text) + '</span></div>'; });
    h += '</div></section>';
  }
  h += isWeek ? renderWeek() : renderMonth();
  document.getElementById('app').innerHTML = h;
}

function renderWeek() {
  var st = add(W.winStart, S.wk * 7);
  var h = '<section class="stack">', count = {};
  for (var i = 0; i < 7; i++) {
    var d = add(st, i), k = key(d), b = W.days[k] || {};
    if (W.sheetOf[k] != null) count[W.sheetOf[k]] = (count[W.sheetOf[k]] || 0) + 1;
    var bl = BLOCKS.filter(function (x) { return b[x] && String(b[x]).trim(); });
    var dues = W.dues[k] || [], tents = W.tentBy[k] || [];
    var filled = bl.length || dues.length || tents.length, isT = k === W.tk;
    var num = d.getDate() === 1 ? (d.getMonth() + 1) + '/1' : String(d.getDate());
    var col = i === 5 ? ' style="color:var(--sat)"' : (i === 6 ? ' style="color:var(--sun)"' : '');
    h += '<div class="day' + (filled ? '' : ' empty') + (isT ? ' today' : '') + '"><div class="dl"><span class="dnum' + (num.length > 2 ? ' sm' : '') + '"' + col + '>' + num + '</span><span class="dow">' + (isT ? '오늘' : DOW_EN[i]) + '</span></div><div class="dbody">';
    if (!filled) h += '<span class="muted">비어 있음</span>';
    dues.forEach(function (x) { h += '<div class="due"><span class="duetag' + (x.done ? ' past' : '') + '">마감</span><span class="rtext' + (x.done ? ' strike' : ' b') + '">' + esc(x.text) + '</span></div>'; });
    bl.forEach(function (x) { h += '<div class="blk"><span class="blab">' + x + '</span><span class="btxt">' + esc(b[x]) + '</span></div>'; });
    tents.forEach(function (t) { h += '<div class="tent"><span class="tentag">잠정</span><span class="blab" style="width:auto;padding:0">' + esc(t.block || '미정') + '</span><span class="rtext">' + esc(t.text) + '</span></div>'; });
    h += '</div></div>';
  }
  h += '</section>';

  var best = null, bn = 0;
  Object.keys(count).forEach(function (s) { if (count[s] > bn) { bn = count[s]; best = +s; } });
  var sh = best != null ? W.sheets[best] : null, objs = sh ? sh.objectives : [];
  var LBL = { todo: '대기', doing: '진행', done: '완료' };
  h += '<section class="sec"><div class="sechead"><h2>Key Objectives</h2><span>' + (S.wk === 1 ? '금주 GTD' : REL[S.wk] + ' GTD') + '</span></div><div class="card">';
  if (!objs.length) h += '<div class="row"><span class="muted">' + (sh ? '이 주는 아직 목표가 없어요' : '이 주의 시트 탭이 아직 없어요') + '</span></div>';
  objs.forEach(function (o) {
    h += '<div class="row"><span class="rtext' + (o.status === 'done' ? ' strike' : ' b') + '">' + esc(o.text) + '</span>' + (o.due ? '<span class="rdue">' + esc(o.due) + '</span>' : '') + '<span class="st ' + o.status + '">' + LBL[o.status] + '</span></div>';
  });
  h += '</div></section>';

  h += '<section class="sec"><h2>Upcoming Schedules</h2>';
  var ups = (W.cur && W.cur.upcoming) || [];
  if (!ups.length) h += '<div class="card"><div class="row"><span class="muted">아직 없음</span></div></div>';
  ups.forEach(function (g) {
    h += '<div class="grp"><span class="ghead' + (g.urgent ? ' urgent' : '') + '">' + esc(g.title) + '</span><div class="card">';
    if (!g.items.length) h += '<div class="row"><span class="muted">아직 없음</span></div>';
    g.items.forEach(function (it) { h += '<div class="row"><span class="rtext' + (it.done ? ' strike' : '') + '">' + esc(it.text) + '</span>' + (it.due ? '<span class="rdue">' + esc(it.due) + '</span>' : '') + '</div>'; });
    h += '</div></div>';
  });
  return h + '</section>';
}

function renderMonth() {
  var md = W.months[S.mo], y = md.getFullYear(), mm = md.getMonth();
  var off = (new Date(y, mm, 1).getDay() + 6) % 7, nd = new Date(y, mm + 1, 0).getDate();
  var total = Math.ceil((off + nd) / 7) * 7;
  var h = '<section class="cal"><div class="grid">';
  ['월', '화', '수', '목', '금', '토', '일'].forEach(function (l, i) { h += '<span class="wh' + (i === 5 ? ' c5' : i === 6 ? ' c6' : '') + '">' + l + '</span>'; });
  h += '</div><div class="grid">';
  for (var i = 0; i < total; i++) {
    var day = i - off + 1;
    if (day < 1 || day > nd) { h += '<span style="height:50px"></span>'; continue; }
    var d = new Date(y, mm, day), k = key(d), col = i % 7;
    var inW = d >= W.winStart && d <= W.winEnd;
    var b = W.days[k], hasEv = b && BLOCKS.some(function (x) { return b[x] && String(b[x]).trim(); });
    var cls = 'cell' + (!inW ? ' out' : '') + (k === W.tk ? ' today' : '') + (k === S.sel ? ' sel' : '');
    var ncol = (!inW || k === S.sel) ? '' : (col === 5 ? ' c5' : col === 6 ? ' c6' : '');
    h += '<button class="' + cls + '" data-a="sel" data-v="' + k + '" aria-label="' + (mm + 1) + '월 ' + day + '일"><span class="n' + ncol + '">' + day + '</span><span class="dots">' +
      (hasEv ? '<span class="dot"></span>' : '') + (W.tentBy[k] ? '<span class="dot o"></span>' : '') + (W.dues[k] ? '<span class="dot r"></span>' : '') + '</span></button>';
  }
  h += '</div><div class="legend"><span><i class="dot"></i>일정</span><span><i class="dot o"></i>잠정</span><span><i class="dot r"></i>마감</span><span style="color:var(--faint)">흐린 날짜: 6주 범위 밖</span></div></section>';

  var sd = fromKey(S.sel), rows = '';
  (W.dues[S.sel] || []).forEach(function (x) { rows += '<div class="row top"><span class="rtag"><span class="rtag due"' + (x.done ? ' style="background:var(--faint)"' : '') + '>마감</span></span><span class="rtext' + (x.done ? ' strike' : ' b') + '">' + esc(x.text) + '</span></div>'; });
  var b2 = W.days[S.sel] || {};
  BLOCKS.forEach(function (x) { if (b2[x] && String(b2[x]).trim()) rows += '<div class="row top"><span class="rtag">' + x + '</span><span class="rtext">' + esc(b2[x]) + '</span></div>'; });
  (W.tentBy[S.sel] || []).forEach(function (t) { rows += '<div class="row top"><span class="rtag"><span class="rtag tent">잠정</span></span><span class="rtext">' + esc((t.block || '미정') + ' · ' + t.text) + '</span></div>'; });
  h += '<section class="sec" style="gap:10px"><h2>' + (sd.getMonth() + 1) + '월 ' + sd.getDate() + '일 ' + DOW_KR[sd.getDay()] + '요일' + (S.sel === W.tk ? ' · 오늘' : '') + '</h2><div class="card">' +
    (rows || '<div class="row"><span class="muted">이날은 비어 있어요</span></div>') + '</div></section>';
  return h;
}

function renderPrev() {
  var el = document.getElementById('prev');
  var p = parse(S.q);
  if (!p) { el.innerHTML = ''; return; }
  var h = '', isDow = !p.date && p.dowIdx !== null, dated = !!(p.date || isDow);
  if (p.date) {
    var d = add(p.date, S.shift);
    h += '<div class="datebox"><button data-a="shift" data-v="-1" aria-label="하루 전">' + IC_L + '</button><span>' + (d.getMonth() + 1) + '/' + d.getDate() + ' (' + DOW_KR[d.getDay()] + ')</span><button data-a="shift" data-v="1" aria-label="하루 뒤">' + IC_R + '</button></div>';
  }
  if (isDow) {
    h += '<span class="hint">어느 ' + '월화수목금토일'[p.dowIdx] + '요일인가요?</span><div class="opts">';
    REL.forEach(function (r, w) {
      var dd = add(W.winStart, w * 7 + p.dowIdx), k = key(dd);
      h += '<button class="opt' + (S.pick === k ? ' on' : '') + '" data-a="pick" data-v="' + k + '"><b>' + (dd.getMonth() + 1) + '/' + dd.getDate() + '</b><small>' + r + '</small></button>';
    });
    h += '</div>';
  }
  if (dated) {
    var cur = S.blockOv || p.block;
    h += '<div class="slots">' + BLOCKS.map(function (x) { return '<button class="slot' + (x === cur ? ' on' : '') + '" data-a="slot" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div>';
  } else {
    h += '<span style="font-size:14px;line-height:1.5;color:var(--mute)">날짜를 찾지 못했어요. 수신함에 넣어두고 시트에서 배치하면 돼요.</span>';
  }
  h += '<div class="ptitle"><span class="ptag">' + (dated ? '잠정' : '수신함') + '</span><b>' + esc(p.title || '(제목 없음)') + '</b></div>';
  var dis = isDow && !S.pick;
  h += '<button class="save" data-a="save"' + (dis ? ' disabled' : '') + '>' + (dis ? '날짜를 골라주세요' : (dated ? '잠정 일정으로 추가' : '수신함에 넣기')) + '</button>';
  el.innerHTML = h;
}

/* ---------- 동작 ---------- */
var qi = document.getElementById('qi');
function haptic() {
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  try {
    var l = document.createElement('label'), i = document.createElement('input');
    l.setAttribute('aria-hidden', 'true'); l.style.display = 'none';
    i.type = 'checkbox'; i.setAttribute('switch', '');
    l.appendChild(i); document.head.appendChild(l); l.click(); document.head.removeChild(l);
  } catch (e) {}
}
var toastT;
function flash(msg) {
  document.getElementById('toastt').textContent = msg;
  var t = document.getElementById('toast');
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.classList.remove('on'); }, 1800);
}
function openQA() {
  if (S.open) return;
  haptic();
  try { qi.focus({ preventScroll: true }); } catch (e) { qi.focus(); }
  S.open = true;
  document.getElementById('qa').classList.add('on');
  document.getElementById('scrim').classList.add('on');
}
function closeQA() {
  qi.blur();
  S.open = false; S.q = ''; S.shift = 0; S.blockOv = null; S.pick = null;
  qi.value = '';
  renderPrev();
  document.getElementById('qa').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
function step(n) {
  if (S.view === 'week') S.wk = Math.max(0, Math.min(5, S.wk + n));
  else goMonth(Math.max(0, Math.min(W.months.length - 1, S.mo + n)));
  render();
}
function goMonth(i) {
  S.mo = i;
  var md = W.months[i];
  S.sel = (md.getMonth() === W.today.getMonth() && md.getFullYear() === W.today.getFullYear()) ? W.tk : key(md);
}
function save() {
  var p = parse(S.q);
  if (!p) return;
  var d = null;
  if (p.date) d = add(p.date, S.shift);
  else if (p.dowIdx !== null) { if (!S.pick) return; d = fromKey(S.pick); }
  var item = { date: d ? key(d) : null, block: d ? (S.blockOv || p.block || '') : '', text: d ? (p.title || S.q.trim()) : S.q.trim(), raw: S.q.trim() };
  if (!data) data = { today: key(W.today), synced: '', sheets: [], tentative: [] };
  data.tentative = (data.tentative || []).concat([item]);
  var raw = item.raw;
  closeQA();
  render();
  apiAdd(item)
    .then(function (list) { data.tentative = list; cache(); render(); flash(item.date ? '시트의 잠정 일정 탭에 저장됨' : '수신함으로 시트에 저장됨'); })
    .catch(function () {
      data.tentative = data.tentative.filter(function (t) { return t !== item; });
      render();
      flash('저장 실패 — 다시 시도해주세요');
      openQA(); qi.value = raw; S.q = raw; renderPrev();
    });
}

document.addEventListener('click', function (e) {
  if (e.target.id === 'scrim') { closeQA(); return; }
  var el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  var a = el.getAttribute('data-a'), v = el.getAttribute('data-v');
  if (a === 'view') { S.view = v; render(); }
  else if (a === 'wk') { S.wk = +v; render(); }
  else if (a === 'mo') { goMonth(+v); render(); }
  else if (a === 'step') step(+v);
  else if (a === 'sel') { S.sel = v; render(); }
  else if (a === 'shift') { S.shift += +v; renderPrev(); }
  else if (a === 'pick') { S.pick = v; renderPrev(); }
  else if (a === 'slot') { S.blockOv = v; renderPrev(); }
  else if (a === 'save') save();
});
qi.addEventListener('input', function () { S.q = qi.value; S.shift = 0; S.blockOv = null; S.pick = null; renderPrev(); });
qi.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); if (!e.isComposing) save(); }
  else if (e.key === 'Escape') closeQA();
});

/* 스와이프: 좌우 = 주/달 넘기기, 맨 위에서 아래로 = 입력창 */
var g = null;
function scrollTop() { return window.scrollY || (document.scrollingElement && document.scrollingElement.scrollTop) || 0; }
document.addEventListener('touchstart', function (e) {
  var t = e.touches[0];
  var skip = e.target.closest && e.target.closest('[data-noswipe]') && !S.open;
  g = skip ? null : { x: t.clientX, y: t.clientY, sy: scrollTop() };
}, { passive: true });
document.addEventListener('touchend', function (e) {
  if (!g) return;
  var t = e.changedTouches[0], dx = t.clientX - g.x, dy = t.clientY - g.y, sy = g.sy;
  g = null;
  if (S.open) { if (dy < -60 && Math.abs(dy) > Math.abs(dx)) closeQA(); return; }
  if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) step(dx < 0 ? 1 : -1);
  else if (dy > 70 && dy > 1.5 * Math.abs(dx) && sy <= 4) openQA();
}, { passive: true });

/* ---------- 불러오기 ---------- */
function cache() { try { localStorage.setItem(CACHE, JSON.stringify(data)); } catch (e) {} }
function load() {
  S.syncing = true;
  if (!KEY) { S.syncing = false; S.error = 'nokey'; render(); return; }
  apiGet()
    .then(function (d) { data = d; S.syncing = false; S.error = ''; cache(); render(); })
    .catch(function (err) { S.syncing = false; S.error = String(err && err.message || err); render(); });
}
try { var c = localStorage.getItem(CACHE); if (c) data = JSON.parse(c); } catch (e) {}
render();
renderPrev();
load();
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && !S.open) load(); });
</script>
</body>
</html>
